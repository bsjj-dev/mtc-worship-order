[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mtc-worship-order"
version = "0.1.0"
description = "Weekly worship order PowerPoint generator for the Mar Thoma Church"
requires-python = ">=3.9"
dependencies = [
    "python-pptx>=0.6.23",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pdfplumber>=0.10.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.0.0",
]

[project.scripts]
mtc-generate = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
